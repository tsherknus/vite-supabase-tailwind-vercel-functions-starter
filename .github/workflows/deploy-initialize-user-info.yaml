name: Deploy Initialize User Info

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: uzwqeithzlrhvccnjzbn

    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
      - run: supabase functions deploy initialize-user-info --project-ref $PROJECT_ID --no-verify-jwt